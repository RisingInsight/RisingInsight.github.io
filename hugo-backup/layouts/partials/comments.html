{{- /* Giscus 评论系统 */ -}}
{{- if .Param "comments" }}
<div class="comments-container" style="margin-top: 3rem; padding: 1.5rem 0;">
    <style>
        .giscus-frame {
            border-radius: var(--radius-md, 10px);
            overflow: hidden;
            border: 1px solid var(--border-light, #eef0f5);
        }
    </style>
    <div class="giscus-frame">
        <script src="https://giscus.app/client.js"
            data-repo="RisingInsight/RisingInsight.github.io"
            data-repo-id="R_kgDOQx_R_A"
            data-category="Announcements"
            data-category-id="DIC_kwDOQx_R_M4C0fi1"
            data-mapping="pathname"
            data-strict="0"
            data-reactions-enabled="1"
            data-emit-metadata="0"
            data-input-position="bottom"
            data-theme="preferred_color_scheme"
            data-lang="zh-CN"
            data-loading="lazy"
            crossorigin="anonymous"
            async>
        </script>
    </div>
</div>

<!-- Giscus 主题跟随系统深色模式 -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const giscusTheme = () => {
            const isDark = document.documentElement.dataset.theme === 'dark'
                || (!document.documentElement.dataset.theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
            return isDark ? 'dark' : 'light';
        };

        // 监听主题切换
        const observer = new MutationObserver(() => {
            const frame = document.querySelector('iframe.giscus-frame');
            if (frame) {
                frame.contentWindow.postMessage(
                    { giscus: { setConfig: { theme: giscusTheme() } } },
                    'https://giscus.app'
                );
            }
        });
        observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    });
</script>
{{- end }}
