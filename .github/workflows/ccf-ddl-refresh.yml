name: CCF DDL 数据刷新

# 每天 04:00 UTC（北京 12:00）自动刷新截稿数据。
# 注意顺序：先提交截稿数据（核心），再跑 OpenAlex 审计/校准（诊断性，
# 受 OpenAlex 配额影响可能失败，不能阻塞数据提交）。
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch: {} # 手动触发

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 刷新截稿数据（ccfddl）
        run: npm run fetch:ddl

      - name: 提交截稿数据（核心，先于诊断步骤）
        run: |
          git config user.name "ccf-ddl-bot"
          git config user.email "actions@github.com"
          git add src/data/ccf-ddl.json
          git diff --cached --quiet && echo "无变化" || (git commit -m "chore(ddl): refresh deadlines $(date -u +%F)" && git push)

      - name: OpenAlex 源审计（诊断性，不阻塞）
        continue-on-error: true
        run: npm run audit:oa

      - name: 解析通过的源烤入快照（诊断性，不阻塞）
        continue-on-error: true
        run: npm run resolve:oa

      - name: 提交审计与校准产物（如有）
        continue-on-error: true
        run: |
          git config user.name "ccf-ddl-bot"
          git config user.email "actions@github.com"
          git add audit-report.txt scripts/openalex-overrides.mjs 2>/dev/null || true
          git diff --cached --quiet && echo "无变化" || (git commit -m "chore(ddl): source calibration $(date -u +%F)" && git push)
